<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Course Organizer | Add Course</title>
</head>
<body>
  <header>
    <h1>Personal Course Organizer</h1>
  </header>
  <nav>
    <a href="home.htm">Home</a>
    <a href="courses.htm">My Courses</a>
    <a href="add-course.htm">Add Course</a>
    <a href="contact.htm">Contact Us</a>
  </nav>
  <main>
    <section>
      <h2>Register New Course</h2>
      <form>
        <label>Course Name</label>
        <input type="text" placeholder="e.g. Electronics" required><br><br>
        <label>Instructor</label>
        <input type="text" placeholder="Instructor Name" required><br><br>
        <label>Credit Hours</label>
        <input type="number" min="1" max="3" placeholder="Max. 3"><br><br>
        <label>Notes</label>
        <textarea placeholder="Additional Notes"></textarea><br>
        <button type="submit">Add Course</button>
      </form>
    </section>
  </main>
  <footer>
    &copy; 2026 Personal Course Organizer™
  </footer>
</body>
</html>
